<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 6 108 108" width="108" height="108" role="img" aria-labelledby="icon-title">
  <title id="icon-title">GDS BOOK STORE</title>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#7e22ce"/>
      <stop offset="1" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset="0.35" stop-color="#fde68a"/>
      <stop offset="0.55" stop-color="#f59e0b"/>
      <stop offset="0.8" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.5" stop-color="#d97706"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#1e0536" flood-opacity="0.55"/>
    </filter>
    <clipPath id="badgeClip"><rect x="12" y="12" width="96" height="96" rx="24"/></clipPath>
  </defs>

  <!-- Badge: glossy purple tile with a gold rim -->
  <g filter="url(#shadow)">
    <rect x="12" y="12" width="96" height="96" rx="24" fill="url(#badge)" stroke="url(#goldEdge)" stroke-width="3.5"/>
  </g>
  <!-- Open book -->
  <g clip-path="url(#badgeClip)">
    <path d="M60 44 C50 37 36 35 26 37 V82 C36 80 50 82 60 89 Z" fill="url(#page)" stroke="#fbbf24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M60 44 C70 37 84 35 94 37 V82 C84 80 70 82 60 89 Z" fill="url(#page)" stroke="#fbbf24" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M60 44 V89" stroke="#b45309" stroke-width="2.5"/>
    <path d="M33 48 C40 47 47 48 53 51 M33 57 C40 56 47 57 53 60 M33 66 C40 65 47 66 53 69 M67 51 C73 48 80 47 87 48 M67 60 C73 57 80 56 87 57 M67 69 C73 66 80 65 87 66" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Glossy highlight on the upper half of the badge -->
    <path d="M12 12 H108 V52 C80 62 40 62 12 52 Z" fill="url(#gloss)" opacity="0.55"/>
  </g>
  <!-- Sparkle -->
  <path d="M98 14 L101 22 L109 25 L101 28 L98 36 L95 28 L87 25 L95 22 Z" fill="#fffbe6" opacity="0.95"/>
</svg>

<nav class="flex flex-wrap items-center justify-between gap-2 px-4 py-2 bg-purple-900 text-white">
  <a routerLink="" class="shrink-0" aria-label="GDS Book Store, home">
    <img src="assets/logo.svg" alt="GDS BOOK STORE" class="h-12 w-auto">
  </a>
  <div>
    <a class="mx-4" routerLink="cart">My Cart</a>
    <ng-container *ngIf="user$ | async as user; else loggedOut">
      <a class="mx-4" routerLink="/orders">My orders</a>
      Hello {{ user.displayName }}
      <ng-container *ngIf="user.metadata?.lastSignInTime as lastLogin">
        Last login: {{ lastLogin }}
      </ng-container>
      <button (click)="logout()" class="mx-4">Logout</button>
    </ng-container>
    <ng-template #loggedOut>
      <a class="mx-4" routerLink="/login">Login</a>
      <a class="mx-4" routerLink="/register">Register</a>
    </ng-template>
  </div>
</nav>

<div class="p-4">
  <router-outlet></router-outlet>
</div>

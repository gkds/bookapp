<section class="max-w-6xl mx-auto">
  <h2 class="text-2xl font-semibold text-center my-6">Programming books catalog</h2>

  <ul class="grid gap-4 sm:gap-6 grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
    <li *ngFor="let book of catalog">
      <app-book class="block h-full" [book]="book" (bookEmitter)="addToCart($event)"></app-book>
    </li>
  </ul>
</section>
